[project]
name = "rag-mcp-server"
version = "0.1.0"
description = "A from-scratch learning implementation of a modular RAG MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0",
  "pyyaml>=6.0",
  "chromadb>=1.5.0",
  "markitdown[pdf]>=0.1.7",
  "jieba>=0.42.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "streamlit>=1.36"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: real external-service tests (Ollama); excluded from default runs",
  "slow: slow tests (e.g. real model smoke); excluded from default runs",
]